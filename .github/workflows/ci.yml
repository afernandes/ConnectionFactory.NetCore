name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test test/ConnectionFactory.NetCore.Tests/ConnectionFactory.NetCore.Tests.csproj -c Release
      - run: dotnet pack src/ConnectionFactory.csproj -c Release --no-restore -o artifacts
